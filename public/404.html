<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>در حال بازگشت به حساب صراف…</title>
  </head>
  <body>
    <p>در حال بازگشت به حساب صراف…</p>
    <script>
      // GitHub Pages project sites live under /A1-Maintenance-Preview/.
      // Preserve that base path so React Router can restore nested routes.
      var basePath = '/A1-Maintenance-Preview/';
      var requestedPath = window.location.pathname + window.location.search + window.location.hash;
      var appPath = requestedPath.indexOf(basePath) === 0
        ? requestedPath.slice(basePath.length)
        : requestedPath.replace(/^\\/+/, '');
      window.location.replace(basePath + '?__spa_path=' + encodeURIComponent('/A1-Maintenance-Preview/' + appPath));
    </script>
  </body>
</html>
