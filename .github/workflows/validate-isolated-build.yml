name: Validate isolated A1 preview build

on:
  push:
    branches:
      - a1-structure-copy
      - feature/tier-icon-visibility
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-a1-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies without production secrets
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Upload build artifact for review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: isolated-a1-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
