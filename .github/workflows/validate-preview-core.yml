name: Validate preview core completion

on:
  push:
    branches:
      - fix/preview-core-completion-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-core-validation
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this isolated work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies without production secrets
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Run accounting and workspace contract tests
        run: npm run test:contracts
      - name: Build application
        run: npm run build
      - name: Upload build artifact for review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: preview-core-validation-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
