name: Deploy isolated A1 maintenance preview
# Rebuild the preview from the latest validated a1-structure-copy commit.
# Mobile and desktop navigation now share the same grouped accounting modules.
# Deployment is triggered from the default branch; application source is always checked out from a1-structure-copy.
# Deployment refresh: publish the newest validated preview source after isolated build checks.
# Refresh requested after the responsive desktop and mobile dashboard validation.

on:
  push:
    branches:
      - main
      - a1-structure-copy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: isolated-a1-maintenance-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated A1 copy only
        uses: actions/checkout@v4
        with:
          ref: a1-structure-copy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build isolated application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publish live preview
        id: deployment
        uses: actions/deploy-pages@v4
