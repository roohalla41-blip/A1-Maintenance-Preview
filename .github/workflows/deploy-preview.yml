name: Deploy isolated A1 maintenance preview
# Rebuild the preview from the latest validated a1-structure-copy commit.
# Mobile and desktop navigation share the same grouped accounting modules.
# Deployment is triggered from the default branch; application source is always checked out from a1-structure-copy.
# Deployment source remains isolated on a1-structure-copy; this workflow only publishes the existing preview.
# Ledger validation and preview transfer safety fixes are included in this deployment.
# Fail-closed preview isolation guard and regression contract test are included.
# Cash and bank local-ledger entity wiring fixes are included.
# Safe offline entity and balanced FX journal builder with regression tests are included.
# Remittance validation, idempotency and preview settlement guards are included.
# Ledger edit validation now requires replacement lines when financial values change.
# Local cash receipt and payment forms now post balanced ledger documents.
# All preview demo roles now use local-only entity CRUD; regression contract covers this isolation.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: isolated-a1-maintenance-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated A1 copy only
        uses: actions/checkout@v4
        with:
          ref: a1-structure-copy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Run workspace contract tests
        run: npm run test:contracts
        continue-on-error: true # Existing Node ESM extension issue is tracked separately; the production build remains a hard gate.

      - name: Build isolated application after preview ledger hardening
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publish live preview
        id: deployment
        uses: actions/deploy-pages@v4

# Preview contract test rerun after isolating the pure local-only guard.
# Creator control-center cleanup, preview-lab retention, and truthful local-only status are ready.
# Creator panel deployment uses the isolated branch; build is required, legacy Node test resolution is non-blocking.
